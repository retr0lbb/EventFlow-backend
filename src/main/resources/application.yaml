spring:
  application:
    name: api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  docker:
    compose:
      file: compose.dev.yaml
      lifecycle-management: start-only

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.springframework.mail: DEBUG

jwt:
  private:
    key: ${JWT_PRIVATE_KEY:file:certs/app.key}
  public:
    key: ${JWT_PUBLIC_KEY:file:certs/app.pub}
  access-token:
    expiration-seconds: 3000      # 5 minutos
  refresh-token:
    expiration-seconds: 86400    # 1 dia (24 horas)